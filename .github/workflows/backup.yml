name: Weekly backup

# export JSON จาก Google Sheet ทุกวันจันทร์ 03:00 (เวลาไทย) เก็บเป็น artifact 90 วัน — ไม่ commit ข้อมูลลง repo
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export
        env:
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/backup.ts
      - uses: actions/upload-artifact@v4
        with:
          name: workout-log-backup
          path: backup-*.json
          retention-days: 90
