name: Weekly backup

# export JSON ทุกวันจันทร์ 03:00 (เวลาไทย) เก็บเป็น artifact 90 วัน — ไม่ commit ข้อมูลลง repo
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret SUPABASE_SERVICE_ROLE_KEY (ดู README)"
            exit 1
          fi
          node scripts/backup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: workout-log-backup
          path: backup-*.json
          retention-days: 90
