name: Keep Supabase awake

# โปรเจกต์ Supabase แพ็กเกจฟรีจะถูกพักถ้าไม่มีการใช้งาน 7 วัน → ping ทุก 3 วัน
on:
  schedule:
    - cron: '17 2 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database via REST
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "ยังไม่ได้ตั้ง secrets"; exit 1; fi
          # anon อ่านข้อมูลไม่ได้เพราะ RLS (ได้ [] กลับมา) แต่ยังเป็นการ query ฐานข้อมูลจริง
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            "$URL/rest/v1/run_plans?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code: $(cat /tmp/out.json)"
          test "$code" = "200"
